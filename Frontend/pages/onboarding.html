<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - PECUS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
    <div class="container min-vh-100 d-flex align-items-center">
        <div class="row w-100">
            <div class="col-md-8 col-lg-6 mx-auto">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <h1 class="logo-text">PECUS</h1>
                            <h3 class="text-primary mb-4">Bienvenido, Juan!</h3>
                            <p class="text-muted">
                                Vamos a configurar tu cuenta para comenzar a organizar tus finanzas.
                            </p>
                        </div>

                        <div class="progress mb-4">
                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 33%;" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <p class="text-center text-muted small">Paso 1 de 3: Agregar tus fuentes</p>

                        <form id="onboarding-form">
                            <div class="mb-4">
                                <label for="onboarding-source-name" class="form-label">Nombre de la fuente</label>
                                <input type="text" class="form-control" id="onboarding-source-name" placeholder="Ej: cuenta sueldo, tarjeta Visa, efectivo" required>
                            </div>
                            <div class="mb-4">
                                <label for="onboarding-source-type" class="form-label">Tipo de fuente</label>
                                <select class="form-select" id="onboarding-source-type" required>
                                    <option value="">Selecciona un tipo</option>
                                    <option value="BANK">Banco</option>
                                    <option value="CREDIT_CARD">Tarjeta de crédito</option>
                                    <option value="WALLET">Billetera virtual</option>
                                    <option value="CASH">Efectivo</option>
                                    <option value="OTHER">Otro</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="onboarding-source-balance" class="form-label">Saldo inicial (ARS)</label>
                                <input type="number" class="form-control" id="onboarding-source-balance" placeholder="0" min="0" step="0.01" required>
                            </div>
                            <div class="mb-4">
                                <label for="onboarding-source-currency" class="form-label">Moneda</label>
                                <select class="form-select" id="onboarding-source-currency" required>
                                    <option value="ARS" selected>ARS (Peso argentino)</option>
                                    <option value="USD">USD (Dólar estadounidense)</option>
                                    <option value="EUR">EUR (Euro)</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">
                                Continuar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/components.js"></script>
</body>
</html>
