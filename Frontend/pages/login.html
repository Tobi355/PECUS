<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - PECUS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
    <div class="container min-vh-100 d-flex align-items-center">
        <div class="row w-100">
            <div class="col-md-6 col-lg-4 mx-auto">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h1 class="logo-text">PECUS</h1>
                            <p class="text-muted text-accent">Iniciar sesión</p>
                        </div>

                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login-email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="login-email" placeholder="tu@email.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="login-password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember-me">
                                    <label class="form-check-label" for="remember-me">Recordarme</label>
                                </div>
                                <a href="#" class="text-decoration-none small text-muted">¿Olvidaste tu contraseña?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">
                                Iniciar sesión
                            </button>

                            <div class="mt-3">
                                <p class="text-center mb-0">¿No tienes una cuenta? <a href="register.html" class="text-decoration-none">Regístrate</a></p>
                            </div>
                        </form>

                        <div class="mt-4 pt-2 border-top">
                            <p class="small text-center text-muted">
                                O continúa con
                            </p>
                            <div class="d-flex justify-content-center mt-2">
                                <a href="#" class="btn btn-outline rounded-pill px-4">
                                    <i data-lucide="chrome" class="me-2"></i> Google
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/components.js"></script>
</body>
</html>
